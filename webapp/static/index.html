<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Studio</title>
  <link rel="stylesheet" href="/static/studio.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body class="h-screen flex flex-col">
  <header class="px-4 py-3 border-b border-[#232830] flex items-center gap-3">
    <span class="font-semibold tracking-wide">Hermes Studio</span>
    <span class="text-xs text-gray-500" id="status"></span>
    <div class="ml-auto flex items-center gap-2 text-xs text-gray-400"
         id="activity" title="Studio activity">
      <span class="activity-dot" id="activity-dot"></span>
      <span id="activity-text">Idle</span>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-[220px_1fr_360px] gap-3 p-3 min-h-0">
    <aside class="panel p-2 overflow-auto">
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-xs uppercase tracking-wider text-gray-500">Projects</span>
        <button class="btn" id="new-project" type="button">+</button>
      </div>
      <nav id="projects"></nav>
    </aside>

    <section class="flex flex-col gap-3 min-h-0">
      <div class="panel flex-1 p-3 overflow-auto min-h-0" id="chatlog"></div>
      <div class="panel p-3">
        <details open>
          <summary class="text-xs uppercase tracking-wider text-gray-500 cursor-pointer mb-2">
            Current prompt
          </summary>
          <pre class="prompt" id="prompt">—</pre>
        </details>
      </div>
      <form class="panel p-2 flex gap-2" id="chat-form">
        <input id="chatinput"
               class="flex-1 bg-transparent outline-none text-sm px-2"
               placeholder="Message the studio agent…" autocomplete="off">
        <button class="btn" id="send-button">Send</button>
      </form>
    </section>

    <aside class="panel p-3 overflow-auto">
      <div class="text-xs uppercase tracking-wider text-gray-500 mb-2">
        Generations
      </div>
      <div id="gens" class="space-y-3"></div>
      <div class="text-xs uppercase tracking-wider text-gray-500 mt-4 mb-2">
        References
      </div>
      <div class="dropzone mb-3" id="dropzone" tabindex="0">
        <div id="drop-text">Drop references here or click to browse</div>
        <div class="text-[10px] mt-1">images · video · audio · 256MB max each</div>
      </div>
      <input id="file-input" type="file" multiple hidden
             accept="image/*,video/*,audio/*">
      <div id="refs" class="grid grid-cols-3 gap-2"></div>
    </aside>
  </main>
</body>
</html>
